<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab-core — wielojęzykowy lab runtime</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23101c28'/%3E%3Crect x='3.5' y='3.5' width='9' height='9' rx='2' fill='none' stroke='%2313a89e' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='1.8' fill='%2365d6c8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <header id="topbar">
      <span class="brand">lab<span class="brand-accent">·</span>core</span>
      <label class="field">
        <span class="field-label">Język</span>
        <select id="lang"></select>
      </label>
      <label class="field">
        <span class="field-label">Przykład</span>
        <select id="example"></select>
      </label>
      <div class="topbar-actions">
        <button id="run" class="btn btn-primary" title="Uruchom kod (Ctrl+Enter)">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
          Run
        </button>
        <button id="stop" class="btn btn-ghost btn-danger" disabled>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="currentColor"/></svg>
          Stop
        </button>
        <button id="clear-world" class="btn btn-ghost" title="Usuwa wszystkie zarejestrowane komponenty (interop)">Wyczyść świat</button>
      </div>
    </header>
    <main>
      <section class="editor-shell" aria-label="Edytor kodu">
        <div id="file-tabs" role="tablist" aria-label="Pliki"></div>
        <div class="editor-body">
          <pre id="gutter" class="gutter" aria-hidden="true"></pre>
          <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Kod źródłowy"></textarea>
        </div>
        <section class="runtime-console" aria-labelledby="console-title">
          <button id="console-toggle" class="console-heading" aria-expanded="true" aria-controls="console">
            <h2 id="console-title">Konsola</h2>
            <div class="console-heading-side">
              <input id="stdin" class="stdin-input" type="text" placeholder="stdin dla input() / cin — \n jako nowa linia" aria-label="Standardowe wejście programu" onclick="event.stopPropagation()" />
              <span id="status-pill" class="runtime-pill runtime-pill--idle" role="status">Czeka</span>
              <svg class="console-chevron" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
            </div>
          </button>
          <pre id="console" class="console-output" tabindex="0" aria-label="Wynik programu i komunikaty"></pre>
        </section>
      </section>
      <aside class="preview-pane" aria-label="Podgląd">
        <div class="preview-heading">
          <h2>Podgląd</h2>
          <div class="preview-actions">
            <span id="fps" class="fps" title="Klatki na sekundę">— fps</span>
            <button id="pause" class="btn btn-mini" disabled title="Pauza/wznów pętlę gry">Pauza</button>
            <button id="restart" class="btn btn-mini" disabled title="Uruchom ponownie od zera">Restart</button>
            <span class="preview-hint">kliknij canvas, steruj klawiaturą</span>
          </div>
        </div>
        <canvas id="canvas" width="640" height="360" tabindex="0"></canvas>
        <div class="world-panel">
          <h3>Hierarchia <span id="world-count" class="world-count">0</span></h3>
          <div id="world-list" class="world-list" aria-live="polite"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
